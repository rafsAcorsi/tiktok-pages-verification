<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TikTok Callback</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 40px; line-height: 1.5; color: #18221e; }
    main { max-width: 760px; }
    code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Conectando TikTok…</h1>
    <p>Você será redirecionado automaticamente para o Shorts Foundry local.</p>
    <p>Se não acontecer, clique em: <a id="manual" href="#">continuar</a></p>
    <p><small>Destino: <code id="dest"></code></small></p>
  </main>
  <script>
    (function () {
      const targetBase = 'http://127.0.0.1:8000/api/tiktok/callback';
      const destination = targetBase + window.location.search;
      document.getElementById('manual').href = destination;
      document.getElementById('dest').textContent = destination;
      window.location.replace(destination);
    })();
  </script>
</body>
</html>
